<script>
    // Enkel evighetsloop
gsap.to("#myTextPath", {
  attr: { startOffset: "100%" },
  duration: 10,
  ease: "none",
  repeat: -1
});

// Eller koppla det till scroll (kräver ScrollTrigger)
gsap.to("#myTextPath", {
  attr: { startOffset: "100%" },
  ease: "none",
  scrollTrigger: {
    trigger: "svg",
    start: "top center",
    end: "bottom top",
    scrub: true // Texten rör sig fram och tillbaka med scrollen
  }
});</script>
